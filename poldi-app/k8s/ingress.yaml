apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lern-rudi
  annotations:
    # For nginx ingress controller
    nginx.ingress.kubernetes.io/rewrite-target: /
    # For SSL/TLS (if using cert-manager)
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # For rate limiting (optional)
    # nginx.ingress.kubernetes.io/limit-rps: "10"
spec:
  ingressClassName: nginx  # Adjust based on your ingress controller
  rules:
  - host: lern-rudi.example.com  # Replace with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: lern-rudi
            port:
              number: 80
  # TLS configuration (uncomment if using HTTPS)
  # tls:
  # - hosts:
  #   - lern-rudi.example.com
  #   secretName: lern-rudi-tls
