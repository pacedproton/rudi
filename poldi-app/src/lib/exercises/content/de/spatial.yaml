# Spatial Module - Wo ist was?
# Spatial relationships and prepositions

id: spatial
title:
  de: "Wo ist was?"
  en: "Where is what?"
intro:
  de: "Finde die richtige Position! Auf, unter, neben, in..."
  en: "Find the correct position! On, under, beside, in..."
category: exekutiv
icon: 📍

