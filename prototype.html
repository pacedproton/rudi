<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>SES Poldi - Gamified & Audio Fix</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #2c3e50;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        touch-action: none;
        font-family: "Arial Rounded MT Bold", "Arial", sans-serif;
      }
      canvas {
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
        border-radius: 12px;
        background: #fff;
        max-width: 100%;
        max-height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="gameCanvas"></canvas>

    <script>
      /**
       * SES POLDI - FULL VERSION (BUGFIX: IndexSizeError in drawPoldi)
       * - Fixed negative radius in mouth animation.
       * - Replaced confusing rhymes (Fisch/Sessel) with clear ones (Krone/Zitrone).
       * - Added option narration ("Is it A or B?").
       * - Improved voice stability.
       */
      (() => {
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // --- CONFIGURATION ---
        const C = {
          colors: {
            sky: "#87CEEB",
            grass: "#7CFC00",
            poldiSkin: "#76c043",
            poldiDark: "#4a8e22",
            red: "#e74c3c",
            wood: "#8B4513",
            gold: "#FFD700",
            white: "#FFFFFF",
            text: "#333333",
            ui: "#f0f0f0",
            btn: "#fff",
            btnBorder: "#8B4513",
            path: "#bdc3c7",
          },
          font: "Arial Rounded MT Bold, Arial, sans-serif",
        };

        // --- GAME ENGINE STATE ---
        let game = {
          state: "MENU",
          width: 0,
          height: 0,
          scale: 1,
          time: 0,

          modules: [],
          currentModuleIdx: 0,
          currentTaskIdx: 0,
          score: {},
          totalKeys: 0,

          feedback: { active: false, success: false },
          inputLocked: false,
          particles: [],
          isSpeaking: false,

          drawPath: [],
          memoryInput: [],
          owlY: -100,
          flashVisible: true,
        };

        // --- ASSETS & TRANSLATIONS ---
        const ASSETS = {
          icons: {
            mushroom: "🍄",
            clover: "☘️",
            ladybug: "🐞",
            butterfly: "🦋",
            flower: "🌸",
            sun: "☀️",
            moon: "🌙",
            star: "⭐",
            tree: "🌳",
            mouse: "🐭",
            fish: "🐠",
            cat: "🐱",
            dog: "🐶",
            elephant: "🐘",
            donkey: "🫏",
            monkey: "🐒",
            frog: "🐸",
            snake: "🐍",
            bear: "🐻",
            lion: "🦁",
            bird: "🐦",
            house: "🏠",
            table: "🪑",
            car: "🚗",
            train: "🚂",
            bus: "🚌",
            ball: "⚽",
            box: "📦",
            crown: "👑",
            scissors: "✂️",
            shoe: "👞",
            book: "📖",
            key: "🔑",
            bed: "🛏️",
            apple: "🍎",
            banana: "🍌",
            cake: "🎂",
            icecream: "🍦",
            cherry: "🍒",
            lemon: "🍋",
            mouth: "👄",
            hand: "🖐️",
            nose: "👃",
          },
          // German labels for speech synthesis
          labels: {
            mushroom: "Pilz",
            clover: "Klee",
            ladybug: "Marienkäfer",
            butterfly: "Schmetterling",
            flower: "Blume",
            sun: "Sonne",
            moon: "Mond",
            star: "Stern",
            tree: "Baum",
            mouse: "Maus",
            fish: "Fisch",
            cat: "Katze",
            dog: "Hund",
            elephant: "Elefant",
            donkey: "Esel",
            monkey: "Affe",
            frog: "Frosch",
            snake: "Schlange",
            bear: "Bär",
            lion: "Löwe",
            bird: "Vogel",
            house: "Haus",
            table: "Tisch",
            car: "Auto",
            train: "Zug",
            bus: "Lokomotive", // Context specific
            ball: "Ball",
            box: "Kiste",
            crown: "Krone",
            scissors: "Schere",
            shoe: "Schuh",
            book: "Buch",
            key: "Schlüssel",
            bed: "Bett",
            apple: "Apfel",
            banana: "Banane",
            cake: "Kuchen",
            icecream: "Eis",
            cherry: "Kirsche",
            lemon: "Zitrone",
            mouth: "Mund",
            hand: "Hand",
            nose: "Nase",
          },
        };

        // --- AUDIO SYSTEM ---
        const audioCtx = new (window.AudioContext ||
          window.webkitAudioContext)();
        let voices = [];

        function loadVoices() {
          voices = window.speechSynthesis.getVoices();
        }
        loadVoices();
        window.speechSynthesis.onvoiceschanged = loadVoices;

        function ensureAudioContext() {
          if (audioCtx.state === "suspended") audioCtx.resume();
        }

        function playSound(type) {
          ensureAudioContext();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          const now = audioCtx.currentTime;

          if (type === "success") {
            osc.type = "sine";
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
            osc.start(now);
            osc.stop(now + 0.6);
          } else if (type === "wrong") {
            osc.type = "triangle";
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.linearRampToValueAtTime(100, now + 0.2);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
          } else if (type === "pop") {
            osc.type = "sine";
            osc.frequency.setValueAtTime(800, now);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
          }
        }

        function speak(text, callback) {
          window.speechSynthesis.cancel();
          game.isSpeaking = true;
          if (voices.length === 0) voices = window.speechSynthesis.getVoices();

          const u = new SpeechSynthesisUtterance(text);
          u.lang = "de-DE";
          u.rate = 0.85;
          u.pitch = 1.1; // Slightly slower for kids

          let selectedVoice =
            voices.find((v) => v.lang === "de-DE") ||
            voices.find((v) => v.lang.includes("de")) ||
            voices[0];
          if (selectedVoice) u.voice = selectedVoice;

          const finish = () => {
            game.isSpeaking = false;
            if (callback) callback();
          };
          u.onend = finish;
          u.onerror = finish;
          window.speechSynthesis.speak(u);
          // Safety
          setTimeout(() => {
            if (game.isSpeaking) finish();
          }, text.length * 120 + 2000);
        }

        function speakNumbers(seq, cb) {
          let i = 0;
          function next() {
            if (i >= seq.length) {
              if (cb) cb();
              return;
            }
            speak(seq[i].toString(), () => {
              setTimeout(() => {
                i++;
                next();
              }, 600);
            });
          }
          next();
        }

        // --- PARTICLE SYSTEM ---
        function spawnParticles(x, y) {
          for (let i = 0; i < 20; i++) {
            game.particles.push({
              x: x,
              y: y,
              vx: (Math.random() - 0.5) * 15,
              vy: (Math.random() - 0.5) * 15,
              life: 1.0,
              color: ["#FFD700", "#FF6347", "#7CFC00", "#00BFFF"][
                Math.floor(Math.random() * 4)
              ],
            });
          }
        }
        function updateParticles() {
          game.particles.forEach((p) => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.5;
            p.life -= 0.03;
          });
          game.particles = game.particles.filter((p) => p.life > 0);
        }
        function drawParticles() {
          game.particles.forEach((p) => {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 6 * game.scale, 0, Math.PI * 2);
            ctx.fill();
          });
          ctx.globalAlpha = 1.0;
        }

        // --- CONTENT ---

        function loadOfficialExam() {
          game.modules = [
            {
              id: "phonology",
              title: "Hören & Sprache",
              intro: "Wir hören uns Wörter an. Mach deine Ohren auf!",
              tasks: [
                // Rhymes: Now using Krone-Zitrone instead of Fisch-Tisch(Chair)
                {
                  type: "rhyme",
                  word: "Maus",
                  target: "house",
                  distractors: ["car"],
                },
                {
                  type: "rhyme",
                  word: "Krone",
                  target: "lemon",
                  distractors: ["shoe"],
                }, // New Clear Rhyme
                // Word Length
                {
                  type: "wordlength",
                  words: [
                    { icon: "train", txt: "Zug", len: 1 },
                    { icon: "bus", txt: "Lokomotive", len: 4 },
                  ],
                  correctIndex: 1,
                },
                // Syllables
                {
                  type: "syllables",
                  word: "Schmetterling",
                  icon: "butterfly",
                  count: 3,
                },
              ],
            },
            {
              id: "math",
              title: "Mengen & Zahlen",
              intro: "Wo sind MEHR Münzen? Schnell, bevor die Eule kommt!",
              tasks: [
                { type: "quantity", l: 4, r: 2 },
                { type: "dice", count: 3 },
                { type: "dice", count: 5 },
              ],
            },
            {
              id: "counting",
              title: "Zählen",
              intro: "Wie viele Dinge siehst du? Tippe auf die Zahl.",
              tasks: [
                { type: "counting", count: 3, icon: "apple" },
                { type: "counting", count: 5, icon: "ladybug" },
                { type: "counting", count: 4, icon: "car" },
              ],
            },
            {
              id: "memory",
              title: "Merkfähigkeit",
              intro: "Ich sage dir Zahlen. Merke sie dir gut!",
              tasks: [
                { type: "memory", seq: [4, 2] },
                { type: "memory", seq: [7, 1, 5] },
              ],
            },
            {
              id: "visual",
              title: "Willi der Maulwurf",
              intro: "Willi sieht schlecht. Wo ist das gleiche Bild?",
              tasks: [
                {
                  type: "discrimination",
                  target: "mushroom",
                  options: ["clover", "mushroom", "flower", "sun"],
                },
                {
                  type: "discrimination",
                  target: "ladybug",
                  options: ["butterfly", "ladybug", "star", "moon"],
                },
              ],
            },
            {
              id: "motor",
              title: "Zeichnen",
              intro: "Hilf Poldi, auf dem Weg zu bleiben!",
              tasks: [
                { type: "trace_path", shape: "curve" },
                { type: "trace", shape: "cross" },
              ],
            },
          ];
        }

        const EXTRA_MODULES = {
          logic: {
            id: "logic",
            title: "🧠 Logik & Reihen",
            intro: "Mach das Muster fertig!",
            tasks: [
              {
                type: "pattern",
                seq: ["🔴", "🔵", "🔴", "🔵"],
                options: ["🔵", "🔴"],
                correct: "🔴",
              },
              {
                type: "pattern",
                seq: ["⭐", "🌙", "⭐"],
                options: ["🌙", "⭐"],
                correct: "🌙",
              },
            ],
          },
          math_plus: {
            id: "math_plus",
            title: "🔢 Mathe Profi",
            intro: "Rechnen und Vergleichen.",
            tasks: [
              { type: "missing", total: 5, visible: 3, hidden: 2 },
              { type: "quantity", l: 5, r: 5 },
            ],
          },
          lang_plus: {
            id: "lang_plus",
            title: "🗣️ Sprach-Forscher",
            intro: "Anlaute hören.",
            tasks: [
              {
                type: "initial",
                letter: "E",
                target: "elephant",
                distractor: "dog",
              },
              {
                type: "initial",
                letter: "A",
                target: "apple",
                distractor: "tree",
              },
              {
                type: "initial",
                letter: "M",
                target: "mouse",
                distractor: "fish",
              },
              {
                type: "rhyme",
                word: "Hund",
                target: "mouth",
                distractors: ["flower"],
              },
            ],
          },
          spatial: {
            id: "spatial",
            title: "📍 Raum & Position",
            intro: "Wo ist der Ball?",
            tasks: [
              {
                type: "preposition",
                audio: "Wo ist der Ball UNTER der Kiste?",
                targetPos: "under",
              },
              {
                type: "preposition",
                audio: "Wo ist der Ball NEBEN der Kiste?",
                targetPos: "right",
              },
            ],
          },
        };

        // --- CORE SYSTEM ---

        function resize() {
          game.width = window.innerWidth;
          game.height = window.innerHeight;
          canvas.width = game.width;
          canvas.height = game.height;
          game.scale = Math.min(game.width / 800, game.height / 600);
        }
        window.addEventListener("resize", resize);
        resize();

        canvas.addEventListener("pointerdown", (e) =>
          handleInput(e.offsetX, e.offsetY, "start")
        );
        canvas.addEventListener("pointermove", (e) =>
          handleInput(e.offsetX, e.offsetY, "move")
        );
        canvas.addEventListener("pointerup", (e) =>
          handleInput(e.offsetX, e.offsetY, "end")
        );

        function handleInput(x, y, type) {
          ensureAudioContext();
          if (
            game.state !== "RESULTS" &&
            (game.inputLocked || game.feedback.active)
          )
            return;

          if (type === "start") {
            playSound("pop");
            if (
              game.state === "TASK" &&
              checkBtn(
                x,
                y,
                game.width - 50 * game.scale,
                game.height - 50 * game.scale,
                60 * game.scale
              )
            ) {
              playInstruction(
                game.modules[game.currentModuleIdx].tasks[game.currentTaskIdx]
              );
              return;
            }
          }

          if (game.state === "MENU") {
            if (type === "start") {
              if (
                checkBtn(
                  x,
                  y,
                  game.width / 2,
                  game.height / 2 + 100 * game.scale
                )
              ) {
                loadOfficialExam();
                startExamSequence();
              }
              if (
                checkBtn(
                  x,
                  y,
                  game.width / 2,
                  game.height / 2 + 180 * game.scale
                )
              ) {
                game.state = "EXTRAS_MENU";
                speak("Wähle eine Übung aus.");
              }
              if (
                checkBtn(
                  x,
                  y,
                  game.width - 80 * game.scale,
                  40 * game.scale,
                  150 * game.scale
                )
              ) {
                playSound("success");
                speak("Der Ton funktioniert.");
              }
            }
          } else if (game.state === "EXTRAS_MENU") {
            if (type === "start") {
              const btnW = 220 * game.scale;
              const btnH = 60 * game.scale;
              const cx = game.width / 2;
              const cy = game.height / 2;
              const hit = (bx, by) =>
                isInside(x, y, bx - btnW / 2, by - btnH / 2, btnW, btnH);
              if (hit(cx - btnW / 2 - 10, cy - btnH / 2 - 10))
                startExtra("logic");
              if (hit(cx + btnW / 2 + 10, cy - btnH / 2 - 10))
                startExtra("math_plus");
              if (hit(cx - btnW / 2 - 10, cy + btnH / 2 + 10))
                startExtra("lang_plus");
              if (hit(cx + btnW / 2 + 10, cy + btnH / 2 + 10))
                startExtra("spatial");
              if (checkBtn(x, y, cx, game.height - 50 * game.scale))
                game.state = "MENU";
            }
          } else if (game.state === "RESULTS") {
            if (
              type === "start" &&
              checkBtn(x, y, game.width / 2, game.height - 80 * game.scale)
            ) {
              game.state = "MENU";
              game.inputLocked = false;
              game.feedback.active = false;
              speak("Hallo! Ich bin Poldi.");
            }
          } else if (game.state === "MODULE_INTRO") {
            if (
              type === "start" &&
              checkBtn(x, y, game.width / 2, game.height / 2 + 100 * game.scale)
            )
              startTask();
          } else if (game.state === "TASK") {
            const task =
              game.modules[game.currentModuleIdx].tasks[game.currentTaskIdx];
            if (task.type === "discrimination")
              handleVisualInput(x, y, task, type);
            else if (task.type === "quantity")
              handleMathInput(x, y, task, type);
            else if (task.type === "pattern")
              handlePatternInput(x, y, task, type);
            else if (
              task.type === "counting" ||
              task.type === "dice" ||
              task.type === "missing" ||
              task.type === "syllables"
            )
              handleNumpadInput(x, y, task, type);
            else if (task.type === "rhyme") handleRhymeInput(x, y, task, type);
            else if (task.type === "wordlength")
              handleWordLengthInput(x, y, task, type);
            else if (task.type === "initial")
              handleInitialInput(x, y, task, type);
            else if (task.type === "memory")
              handleMemoryInput(x, y, task, type);
            else if (task.type === "trace" || task.type === "trace_path")
              handleMotorInput(x, y, task, type);
            else if (task.type === "preposition")
              handlePrepInput(x, y, task, type);
          }
        }

        // --- LOGIC ---

        function startExamSequence() {
          game.score = {};
          game.totalKeys = 0;
          game.modules.forEach((m) => (game.score[m.id] = 0));
          game.currentModuleIdx = 0;
          startModule();
        }
        function startExtra(key) {
          game.modules = [EXTRA_MODULES[key]];
          startExamSequence();
        }
        function startModule() {
          game.currentTaskIdx = 0;
          game.state = "MODULE_INTRO";
          speak(game.modules[game.currentModuleIdx].intro);
        }

        function startTask() {
          game.state = "TASK";
          game.drawPath = [];
          game.memoryInput = [];
          game.inputLocked = false;
          game.flashVisible = true;
          game.particles = [];
          const task =
            game.modules[game.currentModuleIdx].tasks[game.currentTaskIdx];

          // Play Instruction with Options
          playInstruction(task);

          if (task.type === "memory") {
            game.inputLocked = true;
            setTimeout(
              () =>
                speakNumbers(task.seq, () => {
                  game.inputLocked = false;
                }),
              1500
            );
          } else if (task.type === "quantity") game.owlY = -150 * game.scale;
          else if (task.type === "dice")
            setTimeout(() => {
              game.flashVisible = false;
            }, 2000);
        }

        // --- NEW INSTRUCTION SYSTEM ---
        function playInstruction(task) {
          if (task.type === "rhyme") {
            // "What rhymes with Mouse? House? Or Car?"
            speak(
              `Was reimt sich auf ${
                ASSETS.labels[task.word] || task.word
              }? ... ${ASSETS.labels[task.target]}? ... oder ${
                ASSETS.labels[task.distractors[0]]
              }?`
            );
          } else if (task.type === "wordlength") {
            speak(
              `Welches Wort ist länger? ... ${task.words[0].txt}? ... oder ${task.words[1].txt}?`
            );
          } else if (task.type === "initial") {
            speak(
              `Was beginnt mit ${task.letter}? ... ${
                ASSETS.labels[task.target]
              }? ... oder ${ASSETS.labels[task.distractor]}?`
            );
          } else if (task.type === "discrimination") {
            speak(
              `Wo ist das gleiche Bild wie ... ${ASSETS.labels[task.target]}?`
            );
          } else if (task.type === "pattern") speak("Was kommt als nächstes?");
          else if (task.type === "dice") speak("Merk dir die Zahl!");
          else if (task.type === "syllables")
            speak(`Wie viele Silben hat ${task.word}?`);
          else if (task.type === "preposition") speak(task.audio);
          else if (task.type === "missing")
            speak(
              `Es waren ${task.total} Vögel. Jetzt sind nur ${task.visible} da. Wie viele fehlen?`
            );
          else if (task.type === "trace_path")
            speak("Fahre mit dem Finger die Straße nach.");
          else if (task.type === "quantity") speak("Wo sind mehr Münzen?");
          else if (task.type === "counting") speak("Wie viele siehst du?");
        }

        function evaluateTask(success, cx, cy) {
          if (game.feedback.active) return;
          if (success) {
            playSound("success");
            spawnParticles(cx || game.width / 2, cy || game.height / 2);
            game.score[game.modules[game.currentModuleIdx].id]++;
            game.totalKeys++;
          } else {
            playSound("wrong");
          }
          game.inputLocked = true;
          game.feedback.active = true;
          game.feedback.success = success;
          setTimeout(() => {
            game.feedback.active = false;
            nextTask();
          }, 1500);
        }

        function nextTask() {
          game.currentTaskIdx++;
          if (
            game.currentTaskIdx >=
            game.modules[game.currentModuleIdx].tasks.length
          ) {
            game.currentModuleIdx++;
            if (game.currentModuleIdx >= game.modules.length) {
              game.state = "RESULTS";
              game.inputLocked = false;
              playSound("success");
              speak("Das war spitze!");
            } else startModule();
          } else startTask();
        }

        // --- RENDER ---
        function render() {
          game.time++;
          updateParticles();
          ctx.clearRect(0, 0, game.width, game.height);
          const h = game.height * 0.45;
          const g = ctx.createLinearGradient(0, 0, 0, h);
          g.addColorStop(0, C.colors.sky);
          g.addColorStop(1, "#b5e8f7");
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, game.width, h);
          ctx.fillStyle = C.colors.grass;
          ctx.fillRect(0, h, game.width, game.height - h);

          if (game.state !== "MENU" && game.state !== "RESULTS") {
            drawHUD();
            if (game.state !== "EXTRAS_MENU")
              drawPoldi(60 * game.scale, 60 * game.scale, 0.7);
            if (game.state === "TASK")
              drawMagicWand(
                game.width - 50 * game.scale,
                game.height - 50 * game.scale
              );
          }
          if (game.state === "MENU") drawMenu();
          else if (game.state === "EXTRAS_MENU") drawExtrasMenu();
          else if (game.state === "MODULE_INTRO") drawModuleIntro();
          else if (game.state === "TASK") drawTask();
          else if (game.state === "RESULTS") drawResults();
          drawParticles();
          if (game.feedback.active) drawFeedbackOverlay();
          requestAnimationFrame(render);
        }

        // Drawers
        function drawHUD() {
          const sx = game.width - 50 * game.scale;
          ctx.fillStyle = "rgba(0,0,0,0.2)";
          drawRoundedRect(
            sx - 100 * game.scale,
            10 * game.scale,
            140 * game.scale,
            50 * game.scale,
            25
          );
          ctx.font = `${24 * game.scale}px Arial`;
          ctx.fillStyle = "#fff";
          ctx.textAlign = "right";

          if (isInside(x, y, game.width / 2 - sz - 20 * game.scale, yp, sz, sz))
            evaluateTask(true, game.width / 2 - sz / 2, yp + sz / 2);
          if (isInside(x, y, game.width / 2 + 20 * game.scale, yp, sz, sz))
            evaluateTask(false);
        }
        function handlePrepInput(x, y, t, k) {
          if (k !== "start") return;
          const tx = game.width / 2,
            ty = game.height * 0.5;
          if (
            t.targetPos === "under" &&
            isInside(
              x,
              y,
              tx + 50 * game.scale,
              ty - 150 * game.scale,
              120 * game.scale,
              120 * game.scale
            )
          )
            evaluateTask(true, tx + 110 * game.scale, ty - 90 * game.scale);
          else if (
            t.targetPos === "on" &&
            isInside(
              x,
              y,
              tx - 150 * game.scale,
              ty - 150 * game.scale,
              120 * game.scale,
              120 * game.scale
            )
          )
            evaluateTask(true, tx - 90 * game.scale, ty - 90 * game.scale);
          else if (
            t.targetPos === "right" &&
            isInside(
              x,
              y,
              tx + 50 * game.scale,
              ty + 50 * game.scale,
              120 * game.scale,
              120 * game.scale
            )
          )
            evaluateTask(true, tx + 110 * game.scale, ty + 110 * game.scale);
          else evaluateTask(false);
        }
        function handleVisualInput(x, y, t, k) {
          if (k !== "start") return;
          const sz = 100 * game.scale,
            gp = 20 * game.scale,
            sy = game.height * 0.55,
            sx = (game.width - (sz * 2 + gp)) / 2;
          t.options.forEach((o, i) => {
            const c = i % 2,
              r = Math.floor(i / 2),
              bx = sx + c * (sz + gp),
              by = sy + r * (sz + gp);
            if (isInside(x, y, bx, by, sz, sz))
              evaluateTask(o === t.target, bx + sz / 2, by + sz / 2);
          });
        }
        function handleMathInput(x, y, t, k) {
          if (k !== "start") return;
          const w = 150 * game.scale,
            h = 120 * game.scale,
            py = game.height * 0.6,
            gp = 40 * game.scale;
          if (isInside(x, y, game.width / 2 - w - gp / 2, py, w, h))
            evaluateTask(
              t.l >= t.r,
              game.width / 2 - w / 2 - gp / 2,
              py + h / 2
            );
          if (isInside(x, y, game.width / 2 + gp / 2, py, w, h))
            evaluateTask(
              t.r >= t.l,
              game.width / 2 + w / 2 + gp / 2,
              py + h / 2
            );
        }
        function handleRhymeInput(x, y, t, k) {
          if (k !== "start") return;
          const w = 140 * game.scale,
            h = 140 * game.scale,
            py = game.height * 0.5;
          if (isInside(x, y, game.width / 2 - w - 30 * game.scale, py, w, h))
            evaluateTask(
              true,
              game.width / 2 - w / 2 - 30 * game.scale,
              py + h / 2
            );
          if (isInside(x, y, game.width / 2 + 30 * game.scale, py, w, h))
            evaluateTask(false);
        }
        function handleWordLengthInput(x, y, t, k) {
          if (k !== "start") return;
          const w = 160 * game.scale,
            h = 160 * game.scale,
            py = game.height * 0.5;
          if (isInside(x, y, game.width / 2 - w - 30 * game.scale, py, w, h))
            evaluateTask(
              t.correctIndex === 0,
              game.width / 2 - w / 2 - 30 * game.scale,
              py + h / 2
            );
          if (isInside(x, y, game.width / 2 + 30 * game.scale, py, w, h))
            evaluateTask(
              t.correctIndex === 1,
              game.width / 2 + w / 2 + 30 * game.scale,
              py + h / 2
            );
        }
        function handleMemoryInput(x, y, t, k) {
          if (k !== "start") return;
          const sz = 60 * game.scale,
            gp = 15 * game.scale,
            sx = (game.width - (3 * sz + 2 * gp)) / 2,
            sy = game.height * 0.55;
          for (let i = 1; i <= 9; i++) {
            const c = (i - 1) % 3,
              r = Math.floor((i - 1) / 3),
              bx = sx + c * (sz + gp),
              by = sy + r * (sz + gp);
            if (isInside(x, y, bx, by, sz, sz)) {
              game.memoryInput.push(i);
              if (game.memoryInput.length === t.seq.length)
                evaluateTask(
                  JSON.stringify(game.memoryInput) === JSON.stringify(t.seq),
                  bx + sz / 2,
                  by + sz / 2
                );
            }
          }
        }
        function handleMotorInput(x, y, t, k) {
          if (
            k === "start" &&
            checkBtn(x, y, game.width / 2, game.height - 50 * game.scale)
          ) {
            evaluateTask(true, game.width / 2, game.height - 50 * game.scale);
            return;
          }
          if (k === "start") game.drawPath.push([{ x, y }]);
          else if (k === "move" && game.drawPath.length > 0)
            game.drawPath[game.drawPath.length - 1].push({ x, y });
        }

        render();
      })();
    </script>
  </body>
