apiVersion: apps/v1
kind: Deployment
metadata:
  name: lern-rudi
  labels:
    app: lern-rudi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lern-rudi
  template:
    metadata:
      labels:
        app: lern-rudi
    spec:
      containers:
      - name: lern-rudi
        image: lern-rudi:latest  # Replace with your registry/image:tag
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        # Optional: If you need to inject API key at runtime
        # env:
        # - name: VITE_OPENAI_API_KEY
        #   valueFrom:
        #     secretKeyRef:
        #       name: lern-rudi-secrets
        #       key: openai-api-key
---
apiVersion: v1
kind: Service
metadata:
  name: lern-rudi
  labels:
    app: lern-rudi
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: lern-rudi
