# Storytelling Module - Geschichten erzählen
# Narrative skills with AI scoring

id: storytelling
title:
  de: "Geschichten erzählen"
  en: "Storytelling"
intro:
  de: "Erzähl mir eine Geschichte! Benutze die Hinwörter."
  en: "Tell me a story! Use the cue words."
category: schriftsprachlich
icon: 📖

tasks:
  - type: storytelling
    prompt:
      de: "Ein Kind geht in den Zoo"
      en: "A child goes to the zoo"
    image: "🦁"
    cues:
      de: ["Erst", "Dann", "Und dann", "Am Ende"]
      en: ["First", "Then", "And then", "Finally"]
    minDuration: 10
    maxDuration: 60

  - type: storytelling
    prompt:
      de: "Ein Hund findet einen Schatz"
      en: "A dog finds a treasure"
    image: "🐕"
    cues:
