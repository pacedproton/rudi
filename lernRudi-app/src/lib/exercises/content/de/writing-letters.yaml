# Writing track - Buchstabenfamilien
# Druckschrift by motor family (not part of the SES test)

id: writing-letters
title:
  de: "Buchstabenfamilien"
  en: "Letter families"
intro:
  de: "Wir schreiben Druckschrift. Folge zuerst den Linien, dann schreibe allein."
  en: "We write print letters. Trace first, then write on your own."
category: schriftsprachlich

tasks:
  # Family 1 - round
  - type: letter_trace
    character: "c"
    instruction:
      de: "Zeichne den Buchstaben c"
      en: "Trace the letter c"
  - type: letter_write
    character: "c"
    guide: faded
    instruction:
      de: "Schreibe ein c"
      en: "Write a c"
  - type: letter_write
    character: "c"
    guide: hidden
    instruction:
      de: "Schreibe ein c ohne Hilfe"
      en: "Write a c without help"

