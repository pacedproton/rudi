<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
		<!-- Google Analytics (gtag.js) -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-2GZD9WVLCB"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag(){dataLayer.push(arguments);}
			gtag('js', new Date());
			gtag('config', 'G-2GZD9WVLCB');
		</script>
		<link rel="manifest" href="/manifest.json">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<style>
			/* Native App Polish */
			body {
				-webkit-tap-highlight-color: transparent;
				-webkit-touch-callout: none; /* iOS: disable long press menu */
				overscroll-behavior-y: none; /* Disable pull-to-refresh rubberbanding */
				user-select: none; /* Disable text selection globally */
				-webkit-user-select: none;
			}
			/* Allow selection in inputs and prevent iOS zoom (16px rule) */
			input, textarea, select {
				user-select: text;
				-webkit-user-select: text;
				font-size: 16px; /* Prevents auto-zoom on focus in iOS */
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
